name: Trigger Pages Deploy

# main 分支推送时，触发 release 分支的完整部署 workflow。
# 完整逻辑只在 release 分支的 pages.yml 里维护一份，避免两边不同步。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy workflow on release branch
        run: gh workflow run "Deploy Pages (release + preview)" --ref release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
