name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit, rules, and deployment assembly tests
        run: npm test
      - name: Rebuild and verify standalone output
        run: |
          npm run build
          git diff --exit-code
          npm run test:bundle
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Play guided campaign in Chromium
        run: node tests/run-tutorial-browser.mjs
      - name: Upload guided campaign screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-campaign-browser
          path: artifacts/tutorial-*.png
          if-no-files-found: ignore
